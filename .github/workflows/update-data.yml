name: Refresh ENSO data

# ---------------------------------------------------------------------------
# The scheduled backend. Each run:
#   1. runs the pipeline tests (a red test BLOCKS the refresh, so a broken
#      parser can never publish bad numbers),
#   2. fetches + validates the latest NOAA indices (scripts/update_data.py),
#      which also rebuilds the CSV archive in public/archive/,
#   3. commits the refreshed JSON, status.json and archive - only if changed.
#
# DEPLOYMENT: the site is served by GitHub Pages (.github/workflows/pages.yml).
# A commit pushed by this job does not start other workflows by itself, so
# pages.yml redeploys through `workflow_run`, keyed on this workflow's NAME.
#   >>> Do not rename this workflow ("Refresh ENSO data") without changing
#   >>> pages.yml to match. tests/test_release.py checks the pair.
#
# Cadence: the weekly Nino-3.4 value lands on Mondays, the monthly indices
# early each month. Mon + Thu at 16:10 UTC catches everything with a margin.
# GitHub often starts scheduled jobs late (up to ~8 hours has been observed
# here); that is normal and harmless.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "10 16 * * 1"
    - cron: "10 16 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-enso-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the pipeline tests (gates the refresh)
        run: python tests/run_all.py --pipeline

      - name: Fetch, validate, and rebuild data JSON + status telemetry
        run: python scripts/update_data.py

      - name: Commit refreshed data (only if changed)
        run: |
          git config user.name  "enso-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # The archive folder is committed with the data when it exists. If an archive
          # problem ever left it missing, the data must still be committed.
          PATHS="public/data"
          if [ -d public/archive ]; then PATHS="$PATHS public/archive"; fi
          if [ -n "$(git status --porcelain $PATHS)" ]; then
            git add $PATHS
            git commit -m "data: scheduled ENSO refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Committed updated data."
          else
            echo "No data changes — nothing to commit."
          fi
